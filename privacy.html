<h1>プライバシーポリシー</h1>
<p>photo-backup は、開発者本人が自分の PC から自分の Google フォトへ写真をアップロードするためのツールです。</p>
<ul>
<li>使う権限は Google フォトへの追加（photoslibrary.appendonly）だけです</li>
<li>アップロードするのは、利用者が PC 上で選んだ写真と動画だけです</li>
<li>Google から受け取った認証情報は利用者の PC の中にだけ保存し、第三者へ送りません</li>
<li>利用者の情報を集めたり、外部へ提供したりしません</li>
</ul>
